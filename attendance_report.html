<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>گزارش حضور و غیاب پایتون دوره اول</title>
    <style>
        body {
            font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
            direction: rtl;
            padding: 30px;
            color: #333;
            background: #fff;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #2b5876;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0 0 10px 0;
            color: #2b5876;
        }
        .meta-box {
            display: flex;
            justify-content: space-between;
            background: #f4f7f6;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            font-size: 13px;
        }
        th {
            background-color: #2b5876;
            color: #fff;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .btn-box {
            margin-top: 25px;
            text-align: center;
        }
        .print-btn {
            background: #2b5876;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }
        @media print {
            .btn-box {
                display: none;
            }
            body {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>گزارش حضور و غیاب دوره آموزشی</h2>
        <div style="font-size: 14px; color: #555;">کلاس: پایتون دوره اول</div>
    </div>
    <div class="meta-box">
        <div><strong>تعداد کل جلسات:</strong> 3</div>
        <div><strong>تعداد هنرجویان:</strong> 3</div>
        <div><strong>تاریخ صدور:</strong> 1405/06/13 - 22:18</div>
    </div>
    <table>
        <thead>
            <tr>
                <th style="width: 50px;">ردیف</th>
                <th>نام و نام خانوادگی</th>
                <th>حاضر</th>
                <th>موجه</th>
                <th>غیرموجه</th>
                <th>درصد حضور</th>
            </tr>
        </thead>
        <tbody>
            
                <tr>
                    <td>1</td>
                    <td style="font-weight: bold; text-align: right;">احمدرضا کارگر</td>
                    <td>1</td>
                    <td>2</td>
                    <td>0</td>
                    <td style="font-weight: bold;">33.3%</td>
                </tr>
                
                <tr>
                    <td>2</td>
                    <td style="font-weight: bold; text-align: right;">فرشته کارگر</td>
                    <td>2</td>
                    <td>0</td>
                    <td>0</td>
                    <td style="font-weight: bold;">66.7%</td>
                </tr>
                
                <tr>
                    <td>3</td>
                    <td style="font-weight: bold; text-align: right;">محیا جمالی</td>
                    <td>2</td>
                    <td>0</td>
                    <td>1</td>
                    <td style="font-weight: bold;">66.7%</td>
                </tr>
                
        </tbody>
    </table>
    <div class="btn-box">
        <button class="print-btn" onclick="window.print()">🖨️ چاپ / ذخیره PDF</button>
    </div>
    <script>
        window.onload = function() {
            setTimeout(function() { window.print(); }, 300);
        };
    </script>
</body>
</html>
